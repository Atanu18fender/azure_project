# This is a Databricks asset bundle definition for spotify_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: spotify_dab
  uuid: 4373559a-954e-409d-9082-04c90af8c92a

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610608497662.2.azuredatabricks.net:443
    variables:
      catalog: spotify_cata
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405610608497662.2.azuredatabricks.net:443
      # We explicitly deploy to /Workspace/Users/raulatanu569@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/raulatanu569@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: spotify_cata
      schema: prod
    permissions:
      - user_name: raulatanu569@gmail.com
        level: CAN_MANAGE
